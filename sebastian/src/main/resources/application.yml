server:
  port: 8080

spring:
  datasource:
    url: jdbc:sqlserver://${DB_IP:localhost}:1433;databaseName=master;encrypt=true;trustServerCertificate=true
    username: sa
    password: ${DB_PASS:YourStrong@Password123}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true